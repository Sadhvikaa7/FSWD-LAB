
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="program3.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>

        <form id="studentForm">

            <div class="form-group">
                <label for="studentId">Student ID *</label>
                <input type="text" id="studentId" placeholder="Enter Student ID">
                <span class="error" id="studentIdError"></span>
            </div>

            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" placeholder="Enter your name">
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob">
                <span class="error" id="dobError"></span>
            </div>

            <div class="form-group">
                <label>Gender *</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>

                <span class="error" id="genderError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" placeholder="example@email.com">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" placeholder="10-digit mobile number">
                <span class="error" id="mobileError"></span>
            </div>

            <div class="form-group">
                <label for="branch">Branch *</label>
                <select id="branch">
                    <option value="">-- Select Branch --</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="ECE">Electronics and Communication Engineering</option>
                    <option value="EEE">Electrical and Electronics Engineering</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                    <option value="IT">Information Technology</option>
                </select>
                <span class="error" id="branchError"></span>
            </div>

            <div class="form-group">
                <label for="semester">Semester *</label>
                <select id="semester">
                    <option value="">-- Select Semester --</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>
                </select>
                <span class="error" id="semesterError"></span>
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <textarea id="address" placeholder="Enter your address"></textarea>
                <span class="error" id="addressError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" placeholder="Enter password">
                <span class="error" id="passwordError"></span>
            </div>

            <button type="submit">Register</button>

        </form>

        <div id="success">
            Student registration successful!
        </div>

    </div>

    <script src="program3.js"></script>

</body>
</html>

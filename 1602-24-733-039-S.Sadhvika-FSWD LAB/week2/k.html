<!DOCTYPE html> 

<html> 

<head> 

 <title>Even or Odd</title> 

</head> 

<body> 
<h2>JavaScript Example</h2> 
 
<button onclick="showResult()">Click Here</button> 
 
<p id="demo"></p> 
 
<script> 
 
function showResult() { 
 
    let number = 100; 
 
    let student = { 
        name: "Rahul", 
        age: 20, 
        branch: "CSE" 
    }; 
 
    let output = ""; 
 
    output += "Number using toString(): " + number.toString() + "<br><br>"; 
 
    output += "Object using JSON.stringify():<br>" + 
              JSON.stringify(student); 
 
    document.getElementById("demo").innerHTML = output; 
} 
 
</script> 
 

</script>  

 

</body> 

</html>

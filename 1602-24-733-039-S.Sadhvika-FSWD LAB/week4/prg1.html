<!DOCTYPE html>
<html>
<head>
<title>Username Validation</title>
</head>

<body>

Enter number:
<input type="number" id="num">

<button onclick="validate()">Multiply</button>

<p id="result"></p>

<script>

function validate(){

let u=document.getElementById("num").value;

if(u==" "){
    alert("Please enter a number");
}
for(let i=1;i<=10;i++){
    document.getElementById("result").innerHTML+=u+" x "+i+" = "+(u*i)+"<br>";
}
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Second Smallest and Largest</title>
</head>

<body>



<button onclick="findSecondSmallestLargest()">find</button>

<p id="result"></p>

<script>

function findSecondSmallestLargest(){

let arr=[10,5,8,20,15];
arr.sort(function(a,b){return a-b;});
let n=arr.length;
let small=arr[1];
let lar=arr[n-2];

document.getElementById("result").innerHTML="second smallest:" +small+"<br>"+ "second largest:" +lar;

}

</script>

</body>
</html>

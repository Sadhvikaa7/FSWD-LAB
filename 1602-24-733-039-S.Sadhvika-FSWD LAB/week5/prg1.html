<!DOCTYPE html>
<html>
    <head>
        <title>Validation</title>
    </head>
    <body>
        enter the number:
        <input type="text" id="mobile">
        <button onclick="validate()">Validate</button>
        <p id="result"></p>
        <script>
            function validate(){
                let m=document.getElementById("mobile").value;
                let p= /^[6-9]\d{9}$/;
                if(p.test(m)){
                    document.getElementById("result").innerHTML="Valid mobile number";  

                }
                else{
                    document.getElementById("result").innerHTML="Invalid mobile number";
                }
            }
        </script>

        
    </body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Image Events</title>
</head>

<body>

    <h3 id="message">Move or click on the image</h3>

    <img id="myImage" src="https://via.placeholder.com/200" width="200" height="200">

    <script>
        let img=document.getElementById("myImage");
        img.addEventListener("mouseover",function(){
            document.getElementById("message").innerHTML="Mouse is over the image";
        });
        img.addEventListener("mouseout",function(){
            document.getElementById("message").innerHTML="Mouse left the image";
        });
        img.addEventListener("click",function(){
            document.getElementById("message").innerHTML="Image clicked";
        });

    </script>

</body>

</html>

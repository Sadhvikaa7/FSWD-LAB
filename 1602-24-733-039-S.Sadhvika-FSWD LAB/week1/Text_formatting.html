<!DOCTYPE html>
<html>
    <head>
        <title>Text Formatting</title>
    </head>
    <body>
        <h1>Text Formatting</h1>
        <p><b>This text is bold</b></p>
        <p><i>This text is italic</i></p>
        <p><u>This text is underlined</u></p>
        <p><s>This text is strikethrough</s></p>
        <p>10<sup>2</sup>=100</p>
        <p>H<sub>2</sub>O</p>

    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Clickable Image</title>
    </head>
    <body>
        <h1>Clickable Image</h1>
        <a href="https://www.google.com" target="_blank">
            <img src="google.jpg" alt="Google Website" width="200">
        </a>
        <p>CLick the image to visit Google</p>
        <div>
            <h1>This is a heading inside a div.</h1>
            <p>This is a paragraph inside a div.</p>
        </div>
        <p>This is a <span><b>highlighted</b></span> word in a sentence.</p>
    </body>

</html>
